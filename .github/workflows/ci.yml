name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Проверки
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, box]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm install -g yarn@1

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test

  docker:
    name: Образ Docker
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, box]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ympb-player-bot:master \
            -t ympb-player-bot:${{ github.sha }} \
            .

      - name: Убрать старые образы
        run: |
          docker image ls ympb-player-bot --format '{{.Tag}}' \
            | grep -v '^master$' | tail -n +4 \
            | xargs -r -I{} docker image rm ympb-player-bot:{} || true
          docker image prune -f
